<text x="69" y="279" fill="#E7EEFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600">Menos búsqueda. Mejores decisiones.</text>
<text x="69" y="329" fill="#9FB1D1" font-family="DejaVu Sans, Arial, sans-serif" font-size="21">Inteligencia open source para construir</text>
